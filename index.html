<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Membuat Aplikasi Kalkulator</title>
    <link href="https://fonts.googleapis.com/css?family=Inconsolata" rel="stylesheet">
    <style>
        * {
            font-family: 'Inconsolata', monospace;
            color: #555;
            box-sizing: border-box;
        }
        body {
            background-color: #e4e;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: white;
            margin: 10px 0;
        }
        
        .clock {
            font-size: 28px;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        .container {
            width: 320px;
            background-color: white;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            width: 25%;
        }
        button {
            width: 100%;
            height: 70px;
            font-size: 24px;
            background-color: white;
            border: 1px solid #f4f4f4;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        #inputLabel {
            height: 120px;
            font-size: 40px;
            vertical-align: bottom;
            text-align: right;
            padding-right: 16px;
            background-color: #ececec;
            color: #333;
        }
    </style>
</head>
<body>

    <h1><marquee>Membuat aplikasi kalkulator</marquee></h1>
    <h2>KALKULATOR YANTO</h2>
    
    <div class="clock" id="clock">00:00:00</div>

    <div class="container">
        <table border="1" cellspacing="0">
            <tr>
                <td colspan="4" id="inputLabel">0</td>
            </tr>
            <tr>
                <td colspan="3"><button onclick="pushBtn(this);">AC</button></td>
                <td><button onclick="pushBtn(this);">/</button></td>
            </tr>
            <tr>
                <td><button onclick="pushBtn(this);">7</button></td>
                <td><button onclick="pushBtn(this);">8</button></td>
                <td><button onclick="pushBtn(this);">9</button></td>
                <td><button onclick="pushBtn(this);">*</button></td>
            </tr>
            <tr>
                <td><button onclick="pushBtn(this);">4</button></td>
                <td><button onclick="pushBtn(this);">5</button></td>
                <td><button onclick="pushBtn(this);">6</button></td>
                <td><button onclick="pushBtn(this);">-</button></td>
            </tr>
            <tr>
                <td><button onclick="pushBtn(this);">1</button></td>
                <td><button onclick="pushBtn(this);">2</button></td>
                <td><button onclick="pushBtn(this);">3</button></td>
                <td><button onclick="pushBtn(this);">+</button></td>
            </tr>
            <tr>
                <td colspan="2"><button onclick="pushBtn(this);">0</button></td>
                <td><button onclick="pushBtn(this);">.</button></td>
                <td><button onclick="pushBtn(this);">=</button></td>
            </tr>
        </table>
    </div>
 
    <script>
        // ==========================================
        // KODINGAN JAM TERKINI (REAL-TIME)
        // ==========================================
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        
        // Update jam setiap 1 detik (1000 milidetik)
        setInterval(updateClock, 1000);
        updateClock(); // Panggil sekali agar jam langsung muncul saat halaman dimuat

        // ==========================================
        // KODINGAN KALKULATOR
        // ==========================================
        var inputLabel = document.getElementById('inputLabel');
         
        function pushBtn(obj) {
            var pushed = obj.innerHTML;
             
            if (pushed == '=') {
                // Calculate dengan penanganan error (try...catch)
                try {
                    inputLabel.innerHTML = eval(inputLabel.innerHTML);
                } catch (e) {
                    inputLabel.innerHTML = 'Error';
                }
            } else if (pushed == 'AC') {
                // All Clear
                inputLabel.innerHTML = '0';
            } else {
                if (inputLabel.innerHTML == '0' || inputLabel.innerHTML == 'Error') {
                    inputLabel.innerHTML = pushed;
                } else {
                    inputLabel.innerHTML += pushed;   
                }
            }
        }
    </script>
</body>
  </html>
